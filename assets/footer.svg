<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Open to AI and Software Engineering internships">
  <title>Open to opportunities</title>
  <defs>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <clipPath id="fr"><rect width="1200" height="120" rx="18"/></clipPath>
  </defs>
  <style>
    .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
    .wave { animation: drift 12s linear infinite; }
    .wave2 { animation-duration: 18s; animation-direction: reverse; }
    .dot { animation: blink 2s ease-in-out infinite; }
    @keyframes drift { to { transform: translateX(-600px); } }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#fr)">
    <rect width="1200" height="120" fill="#0B1220"/>
    <path class="wave wave2" d="M0 92 Q150 72 300 92 T600 92 T900 92 T1200 92 T1500 92 T1800 92 V120 H0Z" fill="#22D3EE" opacity=".10"/>
    <path class="wave" d="M0 100 Q150 82 300 100 T600 100 T900 100 T1200 100 T1500 100 T1800 100 V120 H0Z" fill="url(#w1)" opacity=".25"/>
    <g class="f">
      <circle class="dot" cx="426" cy="52" r="6" fill="#22C55E"/>
      <text x="612" y="58" text-anchor="middle" font-size="18" font-weight="600" fill="#E2E8F0">Open to AI / Software Engineering internships</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="119" rx="18" fill="none" stroke="#1E2A47"/>
</svg>

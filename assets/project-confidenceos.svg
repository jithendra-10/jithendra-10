<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220" role="img" aria-label="ConfidenceOS: Trust-aware decision support for industrial control rooms">
  <title>ConfidenceOS</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <radialGradient id="glow" cx="1" cy="0" r="0.9">
      <stop offset="0" stop-color="#3B82F6" stop-opacity=".22"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cl"><rect width="400" height="220" rx="16"/></clipPath>
  </defs>
  <style>
    .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
    .wrap { opacity: 0; animation: in .8s cubic-bezier(.2,.7,.2,1) 0.0s forwards; }
    .top { animation: hue 6s linear infinite; }
    .orb { transform-box: fill-box; transform-origin: center; animation: float 6s ease-in-out infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes hue { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
    @keyframes float { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-10px,8px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .wrap { opacity: 1; } }
  </style>
  <g class="wrap f" clip-path="url(#cl)">
    <rect width="400" height="220" fill="#0F172A"/>
    <circle class="orb" cx="380" cy="10" r="120" fill="url(#glow)"/>
    <rect class="top" width="400" height="4" fill="url(#g)"/>
    <text x="28" y="48" font-size="12" font-weight="700" letter-spacing="1.6" fill="#6366F1">INDUSTRIAL AI · HMI</text>
    <rect x="262" y="30" width="112" height="26" rx="13" fill="#422006" stroke="#B45309"/><text x="318" y="47.5" text-anchor="middle" font-size="12" font-weight="700" fill="#FCD34D">🏆 ABB winner</text>
    <text x="28" y="88" font-size="28" font-weight="700" fill="#F1F5F9">ConfidenceOS</text>
    <text x="28" y="120" font-size="15" fill="#94A3B8">Trust-aware decision support</text>
    <text x="28" y="141" font-size="15" fill="#94A3B8">for industrial control rooms</text>
    <rect x="28" y="166" width="69" height="26" rx="13" fill="#1E293B" stroke="#334155"/><text x="63" y="183.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#CBD5E1">FastAPI</text>
    <rect x="105.19999999999999" y="166" width="54" height="26" rx="13" fill="#1E293B" stroke="#334155"/><text x="132" y="183.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#CBD5E1">React</text>
    <rect x="167.2" y="166" width="92" height="26" rx="13" fill="#1E293B" stroke="#334155"/><text x="213" y="183.5" text-anchor="middle" font-size="12.5" font-weight="600" fill="#CBD5E1">WebSockets</text>
  </g>
  <rect x=".5" y=".5" width="399" height="219" rx="16" fill="none" stroke="#1E2A47"/>
</svg>
